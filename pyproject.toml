[project]
name = "bga-bot"
version = "0.1.0"
description = "Self-hosted bot that plays turns on BoardGameArena using LLM reasoning"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlmodel>=0.0.19",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=3.3.2",
    "bcrypt>=4.0",
    "PyJWT>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.coverage.run]
source = ["bot", "frontend"]
omit = ["bot/games/base.py", "bot/bga_client.py", "bot/main.py"]

[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
