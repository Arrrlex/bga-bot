<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BGA Bot{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand">BGA Bot</a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/logs">Logs</a>
                <a href="/logout">Log out</a>
                <span class="nav-meta" id="refresh-status">live</span>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        (function() {
            const status = document.getElementById('refresh-status');
            const es = new EventSource('/tick/stream');
            es.addEventListener('tick', function() {
                location.reload();
            });
            es.onerror = function() {
                status.textContent = 'disconnected';
                // Fall back to polling if SSE fails
                setTimeout(function() { location.reload(); }, {{ refresh_seconds }} * 1000);
            };
        })();
    </script>
</body>
</html>
