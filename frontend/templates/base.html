<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block meta_refresh %}<meta http-equiv="refresh" content="{{ refresh_seconds }}">{% endblock %}
    <title>{% block title %}BGA Bot{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand">BGA Bot</a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/logs">Logs</a>
                <span class="nav-meta">auto-refresh {{ refresh_seconds }}s</span>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
